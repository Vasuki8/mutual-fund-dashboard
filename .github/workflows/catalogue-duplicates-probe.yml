name: Read-only catalogue duplicate inspection
on:
  push:
    branches: [fix/catalogue-duplicate-inspection]
    paths:
      - 'scripts/inspect-catalogue-duplicates.ts'
      - '.github/workflows/catalogue-duplicates-probe.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect one bounded scheme-list response without changing the archive
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/inspect-catalogue-duplicates.ts
