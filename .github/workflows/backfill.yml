name: FundScope accelerated backfill (opt-in)

on:
  schedule:
    # Three additional slots per hour; :37 remains reserved for the linked ChatGPT task.
    - cron: '7,22,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fundscope-accelerated-backfill
  cancel-in-progress: false

jobs:
  import:
    # Disabled until the owner authorizes a dedicated Actions credential and enables the variable.
    if: vars.FUNDSCOPE_GITHUB_BACKFILL_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      FUNDSCOPE_ACTIONS_SERVICE_TOKEN: ${{ secrets.FUNDSCOPE_ACTIONS_SERVICE_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify credential availability
        shell: bash
        run: |
          if [[ -z "$FUNDSCOPE_ACTIONS_SERVICE_TOKEN" ]]; then
            echo "Missing configured private Site service credential." >&2
            exit 1
          fi
      - name: Run bounded import and verify stored state
        shell: bash
        run: |
          set -euo pipefail
          # Standalone runner accepts stdin only. Do not put the credential in argv,
          # a file, or logs. Print only the runner's sanitized summary.
          node --use-env-proxy scripts/sync-cloud.mjs \
            --site-url https://fundscope-research.patelvasuki.chatgpt.site \
            --mode backfill --backfill-interval-minutes 15 \
            --max-seconds 720 --max-batches 80 \
            < <(node -e 'console.log(JSON.stringify({serviceToken:process.env.FUNDSCOPE_ACTIONS_SERVICE_TOKEN}))')
