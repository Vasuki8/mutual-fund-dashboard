name: Temporary read-only NAV discrepancy investigation
on:
  push:
    branches: [audit/nav-discrepancies-20261026]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect saved checkpoint only (no provider requests or writes)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { isCurrentlyReportingOpenEnded } from './src/lib/current-official-schemes.ts';
          const repository=process.env.GITHUB_REPOSITORY,token=process.env.GITHUB_TOKEN;
          if(repository!=='Vasuki8/mutual-fund-dashboard'||!token)throw new Error('Unexpected repository/token');
          const store=createGitHubStore({repository,token,deadline:Date.now()+5*60_000});
          const snapshot=await store.loadSnapshot();
          if(!snapshot)throw new Error('No verified checkpoint');
          const {checkpoint,catalogue}=snapshot,asOf=Date.now();
          const matching=catalogue.entries.filter(entry=>isCurrentlyReportingOpenEnded(entry,asOf));
          const groups={noSavedHistory:[],sourceWithSavedHistory:[],qualityInvalid:[],
            qualityDiscontinuity:[],qualityBoth:[],otherWarning:[],lagged:[]};
          const sample=(entry,state,label)=>({code:entry.schemeCode,issue:label,
            catalogueNavDate:entry.latestDate,historyNavDate:state.coverageEnd,
            historySaved:state.observationCount>0});
          for(const entry of matching){
            const state=checkpoint.states[entry.schemeCode];
            if(!state)throw new Error('Missing checkpoint scheme state');
            if(state.status==='source-error'){
              if(state.observationCount===0)groups.noSavedHistory.push(sample(entry,state,state.lastError));
              else groups.sourceWithSavedHistory.push(sample(entry,state,state.lastError));
            }
            if(state.quality){
              const invalid=state.warnings.some(w=>/^(Invalid NAV|Conflicting NAV)/.test(w));
              const jump=state.warnings.some(w=>/^Unresolved discontinuity/.test(w));
              groups[invalid&&jump?'qualityBoth':invalid?'qualityInvalid':jump?'qualityDiscontinuity':'otherWarning']
                .push(sample(entry,state,'saved-quality-flag'));
            }
            if(state.coverageEnd&&entry.latestDate&&state.coverageEnd<entry.latestDate)
              groups.lagged.push(sample(entry,state,'history-behind-catalogue'));
          }
          const prioritized=Object.fromEntries(Object.entries(groups).map(([key,arr])=>[
            key,{count:arr.length,sample:arr.slice(0,6)}]));
          console.log('CURRENT_SCHEME_DISCREPANCIES '+JSON.stringify({sequence:checkpoint.sequence,
            checkpointAt:checkpoint.updatedAt,knownSchemeCount:checkpoint.counts.total,
            currentOpenEndedNavReporting:matching.length,
            officialManualRosterDate:'2026-10-26',asOf:new Date(asOf).toISOString(),prioritized}));
          // Verify documented corporate action only from immutable saved history.
          const code=145536,bucket=String(Math.floor(code/32)),ref=checkpoint.shards[bucket];
          if(!ref)throw new Error('Target scheme shard not saved');
          const shard=await store.readShard(ref,bucket);
          const doc=shard.records.find(x=>x.schemeCode===code);
          if(!doc)throw new Error('Target scheme history not in verified shard');
          const rows=[...doc.payload.data].reverse();
          const date=s=>s.slice(6,10)+'-'+s.slice(3,5)+'-'+s.slice(0,2);
          const changes=[];
          for(let i=1;i<rows.length;i++){
            const ratio=Number(rows[i].nav)/Number(rows[i-1].nav);
            if(ratio>1.4+1e-12||ratio<0.6-1e-12)
              changes.push({beforeDate:date(rows[i-1].date),afterDate:date(rows[i].date),factor:Number(ratio.toFixed(5))});
          }
          const event=changes.filter(x=>x.beforeDate<'2022-08-16'&&x.beforeDate>='2022-08-05'
            &&x.afterDate>='2022-08-16'&&x.afterDate<='2022-08-23');
          console.log('OVERNIGHT_CORPORATE_ACTION_AUDIT '+JSON.stringify({
            code,schemeName:doc.payload.meta.scheme_name,sequence:checkpoint.sequence,
            source:'verified GitHub Release MFAPI archived history',
            historyShardSha256:ref.sha256,
            state:checkpoint.states[code]?.status,quality:checkpoint.states[code]?.quality,
            observationCount:rows.length,firstDate:date(rows[0].date),lastDate:date(rows.at(-1).date),
            largeMoveCount:changes.length,largeMoves:changes.slice(0,8),eventBoundaryMatches:event.length,
            eventVerified:event.length===1&&changes.length===1&&event[0].factor>=9.5&&event[0].factor<=10.5
          }));
          NODE
