name: Temporary read-only NAV boundary classification
on:
  push:
    branches: [fix/nav-invalid-boundary-triage]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Classify invalid NAV dates for fifteen example histories (no writes)
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          const codes=[100218,100312,100313,100316,100317,100318,100319,100321,100323,100325,100332,100337,100338,100347,100358];
          const asIso=x=>typeof x==='string'&&/^\d\d-\d\d-\d{4}$/.test(x)?x.slice(6)+'-'+x.slice(3,5)+'-'+x.slice(0,2):null;
          for(const code of codes) {
            let info={code};
            try {
              const response=await fetch('https://api.mfapi.in/mf/'+code,{redirect:'error',credentials:'omit',
                headers:{Accept:'application/json'},signal:AbortSignal.timeout(15000)});
              info.http=response.status;
              if(!response.ok){console.log('NAV_BOUNDARY '+JSON.stringify(info));if(response.status===429||response.status===503)break;continue}
              const raw=await response.json();info.status=raw.status;
              const records=Array.isArray(raw.data)?raw.data:[];
              const parsed=records.map((x,i)=>{
                const date=asIso(x?.date);
                const valid=typeof x?.nav==='string'&&/^\d+(?:\.\d+)?$/.test(x.nav)&&Number(x.nav)>0;
                return {date,valid,zero:typeof x?.nav==='string'&&/^0+(?:\.0+)?$/.test(x.nav),i};
              });
              const good=parsed.filter(x=>x.valid&&x.date);
              const bad=parsed.filter(x=>!x.valid||!x.date);
              const first=good.map(x=>x.date).sort()[0];
              const last=good.map(x=>x.date).sort().at(-1);
              const summarize=(rows)=>({count:rows.length,earliest:rows.map(x=>x.date).filter(Boolean).sort()[0]??null,
                latest:rows.map(x=>x.date).filter(Boolean).sort().at(-1)??null});
              info.total=records.length;info.valid=good.length;info.invalid=bad.length;
              info.invalidBefore=bad.filter(x=>x.date&&first&&x.date<first).length;
              info.invalidWithin=bad.filter(x=>x.date&&first&&last&&x.date>=first&&x.date<=last).length;
              info.invalidAfter=bad.filter(x=>x.date&&last&&x.date>last).length;
              info.invalidZero=bad.filter(x=>x.zero).length;
              info.invalidOther=bad.filter(x=>!x.zero).length;
              info.oldestValid=first??null;info.newestValid=last??null;
              info.badDateExamples=bad.slice(0,3).map(x=>x.date);
            } catch (error) {info.error=error instanceof Error?error.name:'request_failed'}
            console.log('NAV_BOUNDARY '+JSON.stringify(info));
            await new Promise(r=>setTimeout(r,900));
          }
          NODE
