name: Temporary active Growth discrepancy grouping
on:
  push:
    branches: [audit/active-growth-discontinuity-groups]
    paths: [.github/workflows/temporary-active-growth-groups.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read bounded active Growth histories without requests to NAV providers or writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { validateShardStates } from './scripts/archive-model.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { auditArchiveSnapshot } from './scripts/archive-data-audit.ts';
          import { financialNavBasis } from './src/lib/corporate-actions.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          assert.equal(repository,'Vasuki8/mutual-fund-dashboard');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+5*60000});
          const snapshot=await store.loadSnapshot();assert.ok(snapshot);
          const original=JSON.stringify(snapshot),at=Date.now(),cache=new Map(),results=[];
          const all=snapshot.catalogue.entries.filter(e=>isActiveRepairCandidate(e,at));
          const flagged=all.filter(e=>snapshot.checkpoint.states[e.schemeCode]?.quality);
          const growth=flagged.filter(e=>/\bgrowth\b/i.test(e.schemeName)&&!/\b(?:idcw|dividend)\b/i.test(e.schemeName));
          const jumpOnly=growth.filter(e=>{
            const w=snapshot.checkpoint.states[e.schemeCode].warnings;
            return w.some(x=>/^Unresolved discontinuity/.test(x))&&!w.some(x=>/^(Invalid NAV|Conflicting NAV)/.test(x));
          });
          for(const entry of jumpOnly.slice(0,128)){
            const code=entry.schemeCode,bucket=String(Math.floor(code/32)),ref=snapshot.checkpoint.shards[bucket];
            assert.ok(ref);
            if(!cache.has(bucket)){
              if(cache.size>=64)break;
              const shard=await store.readShard(ref,bucket);validateShardStates(shard,snapshot.checkpoint.states);cache.set(bucket,shard);
            }
            const doc=cache.get(bucket).records.find(d=>d.schemeCode===code);assert.ok(doc);
            const meta=doc.payload.meta;
            const points=[...doc.payload.data].reverse().map(p=>({date:p.date.slice(6,10)+'-'+p.date.slice(3,5)+'-'+p.date.slice(0,2),nav:Number(p.nav)}));
            const moves=[];
            for(let i=1;i<points.length;i++){
              const factor=points[i].nav/points[i-1].nav;
              if(factor>1.4+1e-12||factor<0.6-1e-12)moves.push({before:points[i-1].date,after:points[i].date,factor:Number(factor.toFixed(8))});
            }
            const fund={meta:{schemeCode:code,schemeName:meta.scheme_name,fundHouse:meta.fund_house,schemeType:meta.scheme_type,schemeCategory:meta.scheme_category},points,warnings:[...doc.warnings],fetchedAt:doc.fetchedAt,source:'mfapi.in',stale:false,fromCache:true};
            const basis=financialNavBasis(fund);
            results.push({code,name:meta.scheme_name,house:meta.fund_house,latestDate:entry.latestDate,observations:points.length,alreadyAdjusted:basis.adjusted,moves:moves.slice(0,4),moveCount:moves.length});
          }
          assert.equal(JSON.stringify(snapshot),original);
          console.log('ACTIVE_GROWTH_GROUPS '+JSON.stringify({sequence:snapshot.checkpoint.sequence,checkedAt:new Date(at).toISOString(),health:auditArchiveSnapshot(snapshot,at).currentlyReporting,flaggedGrowth:growth.length,growthJumpOnly:jumpOnly.length,inspected:results.length,shardsRead:cache.size,limited:results.length!==jumpOnly.length,alreadyAdjusted:results.filter(x=>x.alreadyAdjusted).map(x=>x.code),unresolved:results.filter(x=>!x.alreadyAdjusted),archiveWrites:0,providerRequests:0}));
          NODE
