name: Temporary HDFC unit-basis verification
on:
  push:
    branches: [audit/recovered-active-nav-review]
    paths: [.github/workflows/temporary-hdfc-unit-basis-check.yml]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
        with:
          ref: a403c4b0a5f4a8a296c690977e2cf26cf0ac822a
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Validate exact action against immutable source observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { validateShardStates } from './scripts/archive-model.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { financialNavBasis } from './src/lib/corporate-actions.ts';
          import { qualityBlocked } from './src/lib/format.ts';
          import { cagr, trailingReturn } from './src/lib/analytics.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          assert.equal(repository,'Vasuki8/mutual-fund-dashboard');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+3*60000});
          const snapshot=await store.loadSnapshot();assert.ok(snapshot);
          const code=100868,entry=snapshot.catalogue.entries.find(e=>e.schemeCode===code);
          assert.ok(entry&&isActiveRepairCandidate(entry,Date.now()),'No out-of-scope history inspection');
          const bucket=String(Math.floor(code/32)),ref=snapshot.checkpoint.shards[bucket];assert.ok(ref);
          const shard=await store.readShard(ref,bucket);validateShardStates(shard,snapshot.checkpoint.states);
          const doc=shard.records.find(d=>d.schemeCode===code);assert.ok(doc);
          const docBytes=JSON.stringify(doc),meta=doc.payload.meta;
          const raw={meta:{schemeCode:meta.scheme_code,schemeName:meta.scheme_name,
            fundHouse:meta.fund_house,schemeType:meta.scheme_type,schemeCategory:meta.scheme_category},
            points:[...doc.payload.data].reverse().map(p=>({date:p.date.slice(6,10)+'-'+p.date.slice(3,5)+'-'+p.date.slice(0,2),nav:Number(p.nav)})),
            warnings:[...doc.warnings],fetchedAt:doc.fetchedAt,source:'mfapi.in',fromCache:true,stale:false};
          const original=JSON.stringify(raw),basis=financialNavBasis(raw);
          assert.equal(basis.adjusted,true);assert.equal(basis.adjustment?.factor,100);
          assert.equal(qualityBlocked(raw),true);assert.equal(qualityBlocked(basis.fund),false);
          assert.equal(JSON.stringify(raw),original);assert.equal(JSON.stringify(doc),docBytes);
          assert.equal(basis.fund.points.length,raw.points.length);
          let oldBasisCount=0;
          for(let i=0;i<raw.points.length;i++){
            const old=raw.points[i],next=basis.fund.points[i],pre=old.date<'2015-08-30';
            if(pre)oldBasisCount++;
            assert.equal(next.date,old.date);assert.equal(next.nav,pre?old.nav*100:old.nav);
          }
          const index=raw.points.findIndex(p=>p.date==='2015-08-30');assert.ok(index>0);
          assert.equal(raw.points[index-1].date,'2015-08-28');
          const rawFactor=raw.points[index].nav/raw.points[index-1].nav;
          const adjustedFactor=basis.fund.points[index].nav/basis.fund.points[index-1].nav;
          assert.ok(Math.abs(rawFactor-100)<0.1);assert.ok(Math.abs(adjustedFactor-1)<0.001);
          for(const years of [1,3,5]) assert.equal(trailingReturn(basis.fund.points,years),trailingReturn(raw.points,years));
          const first=basis.fund.points[0],last=basis.fund.points.at(-1);
          const years=(Date.parse(last.date)-Date.parse(first.date))/(86400000*365);
          const independentlyCalculated=(last.nav/first.nav)**(1/years)-1;
          assert.ok(Math.abs(cagr(basis.fund.points)-independentlyCalculated)<1e-10);
          assert.equal(financialNavBasis(basis.fund).adjusted,false);
          console.log('HDFC_UNIT_BASIS_VERIFIED '+JSON.stringify({checkedAt:new Date().toISOString(),
            sourceCommit:'a403c4b0a5f4a8a296c690977e2cf26cf0ac822a',sequence:snapshot.checkpoint.sequence,
            code,name:meta.scheme_name,latestCatalogueNavDate:entry.latestDate,historyEnd:doc.coverageEnd,
            observations:raw.points.length,oldBasisObservations:oldBasisCount,
            beforeDate:raw.points[index-1].date,afterDate:raw.points[index].date,
            rawFactor,adjustedFactor,rawBlocked:qualityBlocked(raw),adjustedBlocked:qualityBlocked(basis.fund),
            rawDocumentSha256:createHash('sha256').update(docBytes).digest('hex'),shardSha256:ref.sha256,
            sourceValuesUnchanged:true,postEventReturnsUnchanged:true,archiveWrites:0,providerRequests:0}));
          NODE
