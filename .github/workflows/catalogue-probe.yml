name: Read-only catalogue incident probe
on:
  push:
    branches: [fix/catalogue-validation-diagnostic]
    paths: [scripts/diagnose-catalogue.ts]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect at most three catalogue responses without writing archive data
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/diagnose-catalogue.ts
