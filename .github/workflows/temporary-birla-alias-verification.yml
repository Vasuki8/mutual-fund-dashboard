name: Temporary verified Birla source-name check
on:
  push:
    branches: [audit/active-nav-scope-and-jumps-20261027]
    paths: [.github/workflows/temporary-birla-alias-verification.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: b7630c74727846400b8e96a5b1951ea5a361f324
          fetch-depth: 6
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Verify full archived source sequence before and after exact alias fix
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          git show e7dcf5b2f370ca852c3ca4ff5e597a01dbdfa177:src/lib/corporate-actions.ts > src/lib/corporate-actions-before.ts
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { financialNavBasis } from './src/lib/corporate-actions.ts';
          import { financialNavBasis as beforeFix } from './src/lib/corporate-actions-before.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { qualityBlocked } from './src/lib/format.ts';
          const repository=process.env.GITHUB_REPOSITORY,code=100047;
          assert.equal(repository,'Vasuki8/mutual-fund-dashboard');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+90_000});
          const snapshot=await store.loadSnapshot();
          assert.ok(snapshot);
          const entry=snapshot.catalogue.entries.find(e=>e.schemeCode===code);
          assert.ok(entry&&isActiveRepairCandidate(entry,Date.now()),'Only a 30-day active repair candidate may be verified.');
          const bucket=String(Math.floor(code/32)),ref=snapshot.checkpoint.shards[bucket];
          assert.ok(ref);
          const shard=await store.readShard(ref,bucket);
          const doc=shard.records.find(r=>r.schemeCode===code);
          assert.ok(doc);
          const meta=doc.payload.meta;
          assert.equal(meta.scheme_name,'Aditya Birla Sun Life Liquid Fund - Regular Plan - GROWTH');
          const fund={meta:{schemeCode:code,schemeName:meta.scheme_name,fundHouse:meta.fund_house,
            schemeType:meta.scheme_type,schemeCategory:meta.scheme_category},
            points:[...doc.payload.data].reverse().map(p=>({date:p.date.slice(6,10)+'-'+p.date.slice(3,5)+'-'+p.date.slice(0,2),nav:Number(p.nav)})),
            warnings:[...doc.warnings],fetchedAt:doc.fetchedAt,source:'mfapi.in',fromCache:true,stale:false};
          const original=structuredClone(fund),originalDoc=JSON.stringify(doc);
          const before=beforeFix(fund),after=financialNavBasis(fund);
          assert.equal(before.adjusted,false);
          assert.equal(qualityBlocked(before.fund),true);
          assert.equal(after.adjusted,true);
          assert.equal(qualityBlocked(after.fund),false);
          assert.equal(after.fund.points.length,fund.points.length);
          for(let i=0;i<fund.points.length;i++){
            const p=fund.points[i],adjusted=after.fund.points[i];
            assert.equal(adjusted.date,p.date);
            assert.equal(adjusted.nav,p.date<'2011-10-07'?p.nav*10:p.nav);
          }
          assert.deepEqual(fund,original);
          assert.equal(JSON.stringify(doc),originalDoc);
          console.log('BIRLA_NAME_FIX_VERIFICATION '+JSON.stringify({sequence:snapshot.checkpoint.sequence,
            code,name:meta.scheme_name,latestCatalogueDate:entry.latestDate,active30Days:true,
            observationCount:fund.points.length,beforeAdjusted:before.adjusted,afterAdjusted:after.adjusted,
            rawPreserved:true,independentWarningsPreserved:true,oldBasisThrough:after.adjustment.oldNavThrough,
            newBasisFrom:after.adjustment.firstNewNavDate,factor:after.adjustment.factor,
            shardSha256:ref.sha256,sourceDocumentSha256:createHash('sha256').update(originalDoc).digest('hex')}));
          NODE
