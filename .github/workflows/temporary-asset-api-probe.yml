name: Temporary Release asset API probe
on:
  push:
    branches: [fix/archive-rest-asset-fallback]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check one failed asset through web and REST endpoints
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto';
          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GITHUB_TOKEN;
          for (const id of ['669622899','669142630']) {
            const metadataResponse = await fetch(`https://api.github.com/repos/${repo}/releases/assets/${id}`, {
              headers: { Authorization: `Bearer ${token}`, Accept: 'application/vnd.github+json',
                'X-GitHub-Api-Version': '2022-11-28' }, redirect: 'manual' });
            if (!metadataResponse.ok) throw new Error('metadata_' + metadataResponse.status);
            const metadata = await metadataResponse.json();
            const web = await fetch(metadata.browser_download_url,{redirect:'manual',headers:{Accept:'application/octet-stream'}});
            console.log('asset',id,'public_entry_status',web.status);
            await web.body?.cancel();
            let response=await fetch(`https://api.github.com/repos/${repo}/releases/assets/${id}`,{
              headers:{Authorization:`Bearer ${token}`,Accept:'application/octet-stream',
                'X-GitHub-Api-Version':'2022-11-28'},redirect:'manual'});
            console.log('asset',id,'api_entry_status',response.status,'api_type',response.headers.get('content-type'));
            if([301,302,303,307,308].includes(response.status)){
              const location=response.headers.get('location');
              await response.body?.cancel();
              const url=new URL(location);
              if(url.protocol!=='https:'|| !['objects.githubusercontent.com','release-assets.githubusercontent.com'].includes(url.hostname))throw new Error('unsafe_redirect');
              response=await fetch(url,{headers:{Accept:'application/octet-stream'},redirect:'error'});
              console.log('asset',id,'cdn_status',response.status);
            }
            if(response.ok){
              const bytes=new Uint8Array(await response.arrayBuffer());
              const actual='sha256:'+createHash('sha256').update(bytes).digest('hex');
              console.log('asset',id,'byte_length',bytes.byteLength,'digest_matches',actual===metadata.digest,'size_matches',bytes.byteLength===metadata.size);
              if(actual!==metadata.digest||bytes.byteLength!==metadata.size)throw new Error('asset_integrity_failed');
            }else {
              console.log('asset',id,'api_fallback_unavailable',response.status);
            }
          }
          NODE
