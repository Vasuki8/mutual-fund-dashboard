name: Temporary FundScope audit script validation
on:
  push:
    branches: [fix/archive-data-triage]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Run read-only health audit against verified Release checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/archive-data-audit.ts
