name: Temporary active NAV scope investigation
on:
  push:
    branches: [audit/active-nav-scope-and-jumps-20261027]
    paths: [.github/workflows/temporary-active-nav-investigation.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect saved catalogue and at most 16 history shards; no provider calls
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { auditArchiveSnapshot } from './scripts/archive-data-audit.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { AMFI_OPEN_ENDED_CODES } from './src/lib/amfi-open-ended-roster.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          if(repository!=='Vasuki8/mutual-fund-dashboard'||!process.env.GITHUB_TOKEN)throw Error('audit_context_invalid');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+4*60_000});
          const snapshot=await store.loadSnapshot();
          if(!snapshot)throw Error('audit_snapshot_absent');
          const {catalogue,checkpoint}=snapshot,now=Date.now();
          const official=new Set(AMFI_OPEN_ENDED_CODES),day=86400_000,today=Math.floor(now/day)*day;
          const reasons={},samples={},dateCounts={};
          let currentTotal=0,recentRetainedNotCurrent=0;
          const add=(reason,e)=>{reasons[reason]=(reasons[reason]??0)+1;
            if((samples[reason]??=[]).length<5)samples[reason].push({code:e.schemeCode,date:e.latestDate,current:e.current});};
          for(const e of catalogue.entries){
            if(e.current)currentTotal++;
            if(!official.has(e.schemeCode))continue;
            const t=e.latestDate?Date.parse(e.latestDate+'T00:00:00Z'):NaN;
            if(!e.current&&Number.isFinite(t)&&t>=today-30*day&&t<=today)recentRetainedNotCurrent++;
            const reason=isActiveRepairCandidate(e,now)?'eligible':!e.current?'absent_current':
              !e.latestDate?'missing_date':!Number.isFinite(t)?'invalid_date':t>today?'future_date':
              t<today-30*day?'older_than_30_days':!(Number(e.nav)>0)?'invalid_nav':'other';
            add(reason,e);
            dateCounts[e.latestDate??'missing']=(dateCounts[e.latestDate??'missing']??0)+1;
          }
          console.log('ACTIVE_SCOPE_AUDIT '+JSON.stringify({sequence:checkpoint.sequence,
            checkpointAt:checkpoint.updatedAt,catalogueFetchedAt:catalogue.fetchedAt,
            counts:checkpoint.counts,currentTotal,recentRetainedNotCurrent,reasons,samples,
            commonDates:Object.entries(dateCounts).sort((a,b)=>b[1]-a[1]).slice(0,10),
            catalogueWarnings:catalogue.warnings,current:auditArchiveSnapshot(snapshot,now).currentlyReporting}));
          const candidates=catalogue.entries.filter(e=>isActiveRepairCandidate(e,now)&&
            /\bgrowth\b/i.test(e.schemeName)&&!/\b(idcw|dividend)\b/i.test(e.schemeName)&&
            checkpoint.states[e.schemeCode]?.warnings.some(w=>/^Unresolved discontinuity:/.test(w)));
          const buckets=new Map(),chosen=[];
          for(const e of candidates){
            if(chosen.length>=24)break;
            const bucket=String(Math.floor(e.schemeCode/32));
            if(!buckets.has(bucket)&&buckets.size>=16)continue;
            if(!buckets.has(bucket))buckets.set(bucket,null);
            chosen.push(e);
          }
          const records=[];
          const iso=d=>d.slice(6,10)+'-'+d.slice(3,5)+'-'+d.slice(0,2);
          for(const e of chosen){
            const bucket=String(Math.floor(e.schemeCode/32)),ref=checkpoint.shards[bucket];
            if(!ref)throw Error('audit_target_shard_absent');
            if(!buckets.get(bucket))buckets.set(bucket,await store.readShard(ref,bucket));
            const doc=buckets.get(bucket).records.find(d=>d.schemeCode===e.schemeCode);
            if(!doc)throw Error('audit_target_history_absent');
            const rows=[...doc.payload.data].reverse(),moves=[];
            for(let i=1;i<rows.length;i++){
              const factor=Number(rows[i].nav)/Number(rows[i-1].nav);
              if(factor>1.4+1e-12||factor<0.6-1e-12)moves.push({before:iso(rows[i-1].date),after:iso(rows[i].date),factor:Number(factor.toFixed(8))});
            }
            records.push({code:e.schemeCode,name:doc.payload.meta.scheme_name,latestNavDate:e.latestDate,
              invalid:doc.warnings.some(w=>/^(Invalid NAV|Conflicting NAV)/.test(w)),
              observations:rows.length,moveCount:moves.length,moves:moves.slice(0,4),digest:ref.sha256});
          }
          console.log('ACTIVE_GROWTH_JUMPS '+JSON.stringify({sequence:checkpoint.sequence,
            eligibleGrowthJumpCount:candidates.length,readShards:buckets.size,samples:records}));
          NODE
