name: Temporary catalogue recovery verification
on:
  push:
    branches: [audit/catalogue-completeness-20261027]
    paths: [.github/workflows/temporary-catalogue-recovery-verification.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 680fc4a7598a30ec0a82851779eaa3fb9107a17a
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Check before and after membership, original NAV dates and active-only scope
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { createSource } from './scripts/github-history-v2.ts';
          import { fetchVerifiedCatalogue } from './scripts/verified-catalogue.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { isCurrentlyReportingOpenEnded } from './src/lib/current-official-schemes.ts';
          import { auditArchiveSnapshot } from './scripts/archive-data-audit.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          assert.equal(repository,'Vasuki8/mutual-fund-dashboard');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+90_000});
          const snapshot=await store.loadSnapshot(); assert.ok(snapshot);
          assert.ok(!snapshot.checkpoint.sourceRetryAt||Date.parse(snapshot.checkpoint.sourceRetryAt)<=Date.now());
          const original=JSON.stringify(snapshot),paths=[],responses=new Map();
          const transport=createSource({deadline:Date.now()+60_000});
          const source=async path=>{
            assert.ok(path==='/mf/latest'||path==='/mf'||/^\/mf\?limit=1&offset=\d+$/.test(path));
            assert.ok(paths.length<3); paths.push(path);
            const value=await transport(path);responses.set(path,value);return value;
          };
          const recovered=await fetchVerifiedCatalogue(source,snapshot.catalogue,Date.now);
          const list=new Set(responses.get('/mf').map(e=>e.schemeCode));
          const bulk=new Set(responses.get('/mf/latest').map(e=>e.schemeCode));
          const prior=new Map(snapshot.catalogue.entries.map(e=>[e.schemeCode,e]));
          const now=Date.now(),restored=[];
          for(const e of recovered.entries){
            assert.equal(e.current,list.has(e.schemeCode));
            const old=prior.get(e.schemeCode);
            if(!bulk.has(e.schemeCode)){
              assert.equal(e.latestDate,old?.latestDate??null);
              assert.equal(e.nav,old?.nav??null);
            }
            if(e.current&&!old?.current&&isActiveRepairCandidate(e,now)) restored.push(e.schemeCode);
          }
          assert.equal(JSON.stringify(snapshot),original,'No source observations, history state or warnings may be mutated.');
          assert.ok(restored.length>0,'The independently listed missing recent population must be recovered.');
          const before=snapshot.catalogue.entries.filter(e=>isActiveRepairCandidate(e,now)).length;
          const after=recovered.entries.filter(e=>isActiveRepairCandidate(e,now)).length;
          const hypothetical={checkpoint:snapshot.checkpoint,catalogue:recovered};
          // Audit aggregation is read-only; this is a candidate catalogue, NOT a saved checkpoint.
          const health=auditArchiveSnapshot(hypothetical,now).currentlyReporting;
          console.log('CATALOGUE_RECOVERY_VERIFIED '+JSON.stringify({checkedAt:new Date(now).toISOString(),
            baseSequence:snapshot.checkpoint.sequence,requests:paths,metadata:recovered.membership,
            beforeRepairEligible:before,afterRepairEligible:after,restoredRecentCodes:restored.length,
            websiteSevenDayEligible:recovered.entries.filter(e=>isCurrentlyReportingOpenEnded(e,now)).length,
            candidateHealth:health,rawSnapshotUnchanged:true,archiveWrites:0,
            baseSnapshotSha256:createHash('sha256').update(original).digest('hex'),
            candidateCatalogueSha256:createHash('sha256').update(JSON.stringify(recovered)).digest('hex')}));
          NODE
