name: Temporary HDFC ETF split review
on:
  push:
    branches: [audit/active-growth-discontinuity-groups]
    paths: [.github/workflows/temporary-hdfc-etf-review.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Inspect exact histories without provider requests or archive writes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { createHash } from 'node:crypto';
          import { createGitHubStore } from './scripts/archive-store.ts';
          import { validateShardStates } from './scripts/archive-model.ts';
          import { isActiveRepairCandidate } from './scripts/active-repair-scope.ts';
          import { financialNavBasis } from './src/lib/corporate-actions.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          assert.equal(repository,'Vasuki8/mutual-fund-dashboard');
          const store=createGitHubStore({repository,token:process.env.GITHUB_TOKEN,deadline:Date.now()+4*60000});
          const snapshot=await store.loadSnapshot();assert.ok(snapshot);
          const originalSnapshot=JSON.stringify(snapshot),at=Date.now(),results=[];
          for(const code of [113049,135853]){
            const entry=snapshot.catalogue.entries.find(e=>e.schemeCode===code);
            assert.ok(entry&&isActiveRepairCandidate(entry,at));
            const bucket=String(Math.floor(code/32)),ref=snapshot.checkpoint.shards[bucket];assert.ok(ref);
            const shard=await store.readShard(ref,bucket);validateShardStates(shard,snapshot.checkpoint.states);
            const doc=shard.records.find(d=>d.schemeCode===code);assert.ok(doc);
            const original=JSON.stringify(doc),meta=doc.payload.meta;
            const points=[...doc.payload.data].reverse().map(p=>({date:p.date.slice(6,10)+'-'+p.date.slice(3,5)+'-'+p.date.slice(0,2),nav:Number(p.nav)}));
            const moves=[];
            for(let i=1;i<points.length;i++){
              const factor=points[i].nav/points[i-1].nav;
              if(factor>1.4+1e-12||factor<0.6-1e-12)moves.push({before:points[i-1].date,after:points[i].date,factor});
            }
            const raw={meta:{schemeCode:code,schemeName:meta.scheme_name,fundHouse:meta.fund_house,schemeType:meta.scheme_type,schemeCategory:meta.scheme_category,isinGrowth:meta.isin_growth},points,warnings:[...doc.warnings],fetchedAt:doc.fetchedAt,source:'mfapi.in',stale:false,fromCache:true};
            const basis=financialNavBasis(raw);
            assert.equal(JSON.stringify(doc),original);
            results.push({code,name:meta.scheme_name,house:meta.fund_house,isinGrowth:meta.isin_growth??null,catalogueIsin:entry.isinGrowth??null,latestNavDate:entry.latestDate,observations:points.length,start:doc.coverageStart,end:doc.coverageEnd,moves,warningCount:doc.warnings.length,invalidOrConflict:doc.warnings.some(w=>/^(Invalid NAV|Conflicting NAV)/.test(w)),jumpWarnings:doc.warnings.filter(w=>/^Unresolved discontinuity/.test(w)),alreadyAdjusted:basis.adjusted,rawDocumentSha256:createHash('sha256').update(original).digest('hex'),shardSha256:ref.sha256});
          }
          assert.equal(JSON.stringify(snapshot),originalSnapshot);
          console.log('HDFC_ETF_REVIEW '+JSON.stringify({sequence:snapshot.checkpoint.sequence,checkedAt:new Date(at).toISOString(),results,providerRequests:0,archiveWrites:0}));
          NODE
