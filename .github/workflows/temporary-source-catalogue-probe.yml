name: Temporary source catalogue cross-check
on:
  push:
    branches: [audit/active-nav-scope-and-jumps-20261027]
    paths: [.github/workflows/temporary-source-catalogue-probe.yml]
permissions:
  contents: read
jobs:
  inspect:
    if: github.repository == 'Vasuki8/mutual-fund-dashboard'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Read latest metadata only; never repair or save a fund history
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node --experimental-strip-types --input-type=module <<'NODE'
          import { createGitHubStore, readLimited } from './scripts/archive-store.ts';
          import { validateHistory, dateISO } from './server/validation.ts';
          const repository=process.env.GITHUB_REPOSITORY;
          if(repository!=='Vasuki8/mutual-fund-dashboard')throw Error('audit_repository_invalid');
          const snapshot=await createGitHubStore({repository,token:process.env.GITHUB_TOKEN,
            deadline:Date.now()+90_000}).loadSnapshot();
          if(!snapshot)throw Error('audit_snapshot_absent');
          if(snapshot.checkpoint.sourceRetryAt&&Date.parse(snapshot.checkpoint.sourceRetryAt)>Date.now())
            throw Error('source_cooldown_active');
          const observations=[];
          for(const path of ['/mf/latest','/mf/138875/latest','/mf/145536/latest']){
            const response=await fetch('https://api.mfapi.in'+path,{method:'GET',credentials:'omit',
              redirect:'error',headers:{Accept:'application/json'},signal:AbortSignal.timeout(12000)});
            if(!response.ok){await response.body?.cancel();throw Error('source_http_'+response.status);}
            const raw=JSON.parse(Buffer.from(await readLimited(response,path==='/mf/latest'?32*1024*1024:1024*1024)).toString('utf8'));
            if(path==='/mf/latest'){
              if(!Array.isArray(raw))throw Error('catalogue_shape_invalid');
              const codes=raw.map(e=>e.schemeCode).filter(Number.isSafeInteger);
              observations.push({path,count:raw.length,minimumCode:Math.min(...codes),maximumCode:Math.max(...codes),
                includes138875:codes.includes(138875),includes145536:codes.includes(145536),
                includes154804:codes.includes(154804)});
            }else{
              const code=Number(path.split('/')[2]),parsed=validateHistory(raw,code);
              observations.push({path,code,schemeName:parsed.payload.meta.scheme_name,
                navDate:dateISO(parsed.payload.data[0].date),positive:Number(parsed.payload.data[0].nav)>0,
                archiveCurrent:snapshot.catalogue.entries.find(e=>e.schemeCode===code)?.current??null,
                archiveNavDate:snapshot.catalogue.entries.find(e=>e.schemeCode===code)?.latestDate??null});
            }
          }
          console.log('CATALOGUE_CROSSCHECK '+JSON.stringify({checkedAt:new Date().toISOString(),
            sequence:snapshot.checkpoint.sequence,requests:observations.length,observations}));
          NODE
